spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/remote_support}
    username: ${DB_USERNAME:remote_support}
    password: ${DB_PASSWORD:remote_support}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Carrier invoice PDFs (client-invoice-generation ticket) can run a few MB; Spring's own
      # 1MB/10MB defaults are too small for a scanned invoice.
      max-file-size: 20MB
      max-request-size: 20MB

app:
  jwt:
    # Dev-only default secret. Override with JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  object-store:
    # Carrier Invoice File bytes live in an S3-compatible object store (ADR 0007). These defaults
    # are dev-only and serve the local SeaweedFS (docker compose, tests, e2e) and nothing else.
    # Production sets all of OBJECT_STORE_ENDPOINT, OBJECT_STORE_REGION, OBJECT_STORE_BUCKET,
    # OBJECT_STORE_ACCESS_KEY, OBJECT_STORE_SECRET_KEY, OBJECT_STORE_PATH_STYLE and
    # OBJECT_STORE_CREATE_BUCKET; see ADR 0007 for the values a hosted store needs.
    endpoint: ${OBJECT_STORE_ENDPOINT:http://localhost:8333}
    region: ${OBJECT_STORE_REGION:us-east-1}
    bucket: ${OBJECT_STORE_BUCKET:remote-support-files}
    access-key: ${OBJECT_STORE_ACCESS_KEY:dev-only-access-key}
    secret-key: ${OBJECT_STORE_SECRET_KEY:dev-only-secret-key-change-me}
    path-style-access: ${OBJECT_STORE_PATH_STYLE:true}
    create-bucket: ${OBJECT_STORE_CREATE_BUCKET:true}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{tenantId}:%X{userId}] %logger{36} - %msg%n"
