services:
  # Local Postgres for backend dev and the frontend E2E login suite
  # (frontend/tests/e2e), which needs a real backend rather than demo data.
  # Backend integration tests use Testcontainers instead and don't touch this.
  # scripts/run-backend-for-e2e.sh only ever starts this one service, so the
  # demo stack below never affects the e2e flow.
  postgres:
    image: postgres:16-alpine
    environment: &postgres-environment
      POSTGRES_DB: remote_support
      POSTGRES_USER: remote_support
      POSTGRES_PASSWORD: remote_support
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remote_support"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A second, separate Postgres for the demo story (demo-data-story spec.md
  # Solution, "Separate databases"): its own named volume, so resetting the
  # demo never touches `postgres` above or the e2e flow. No host port is
  # published — nothing outside this compose file needs to reach it directly.
  postgres-demo:
    image: postgres:16-alpine
    # Same user and password as `postgres` above; only the database name differs.
    environment:
      <<: *postgres-environment
      POSTGRES_DB: remote_support_demo
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    healthcheck:
      # -d: without it pg_isready probes a database named after the user
      # (remote_support), which doesn't exist here, and Postgres logs a FATAL
      # on every probe.
      test: ["CMD-SHELL", "pg_isready -U remote_support -d remote_support_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The S3-compatible object store holding Carrier Invoice File bytes (ADR 0007).
  # SeaweedFS runs as one all-in-one server with its S3 gateway on; its data lives
  # in the `seaweedfs_data` volume, so files survive a backend rebuild. The tag is
  # pinned, never `latest`, and is the same one the backend tests and both e2e
  # backend scripts use. No host port is published: the store is private, only the
  # backend reaches it, on the compose network at http://seaweedfs:8333. The S3
  # credentials are dev-only defaults for this local store (like POSTGRES_PASSWORD)
  # and are never a hosted store's; AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are how
  # this version configures its admin S3 identity.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3
    environment:
      AWS_ACCESS_KEY_ID: dev-only-access-key
      AWS_SECRET_ACCESS_KEY: dev-only-secret-key-change-me
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # Any HTTP answer (an unauthenticated request is a 403) proves the S3 gateway is up.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333/"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Full app stack (backend + frontend) for quick manual testing and demoing
  # every feature with a coherent business — `docker compose up --build` and
  # open http://localhost:3000. The backend runs under the `demo` Spring
  # profile against `postgres-demo` above, which builds the demo story once,
  # on first startup (com.remotesupport.backend.demo.DemoDataLoader) — a
  # restart leaves it alone. See README.md for every login, its password, and
  # what that role should look at to see each feature.
  #
  # To reset the demo alone (get back to the clean story), without touching
  # the e2e stack's own `postgres` volume:
  #   docker compose rm -sf backend postgres-demo
  #   docker volume rm remote-support-app_postgres_demo_data
  #   docker compose up --build
  # Add `seaweedfs` to the `rm` and `remote-support-app_seaweedfs_data` to the
  # `volume rm` when you also want a clean file store.
  # (the volume name is `<project-name>_postgres_demo_data` — `docker volume
  # ls` shows the exact name if your compose project isn't named
  # `remote-support-app`, e.g. because of the directory this file lives in).
  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres-demo:5432/remote_support_demo
      DB_USERNAME: remote_support
      DB_PASSWORD: remote_support
      SPRING_PROFILES_ACTIVE: demo
      # JWT_SECRET intentionally unset: application.yml's dev-only default is fine for
      # local manual testing. Set it here if you need tokens stable across rebuilds.
      # Carrier Invoice Files live in the `seaweedfs` service's volume (ADR 0007), so they
      # survive a rebuild of this container. Same dev-only credentials as `seaweedfs`.
      OBJECT_STORE_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORE_ACCESS_KEY: dev-only-access-key
      OBJECT_STORE_SECRET_KEY: dev-only-secret-key-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres-demo:
        condition: service_healthy
      # Started first, never waited on: the backend starts whatever the store's state.
      seaweedfs:
        condition: service_started
    healthcheck:
      # Same unauthenticated liveness endpoint scripts/run-backend-for-e2e.sh polls
      # (HealthController), not actuator's /actuator/health.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_demo_data:
  seaweedfs_data:
